name: Internship scan

on:
  schedule:
    - cron: "17 * * * *"   # every hour (UTC)
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: internship-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan and notify
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: 8989519158:AAFNaDshSV4p2aqAkAuwi8VqjlzSz8AitrE
          TELEGRAM_CHAT_ID: 1937650654
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}

      - name: Save list of already-sent jobs
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "update seen jobs" && git push)
