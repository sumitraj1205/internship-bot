name: Internship scan

on:
  schedule:
    - cron: "17 * * * *"   # every hour (UTC)
  workflow_dispatch:        # lets you press "Run workflow" manually

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan and notify
        run: python scan_once.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOCATION_FILTER: "india,remote,anywhere,bengaluru,bangalore,hyderabad,pune,mumbai,delhi,gurgaon,gurugram,noida,chennai,kolkata"
          FIRST_RUN_LIMIT: "25"

      - name: Save seen-jobs list
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.db
          git diff --cached --quiet || (git commit -m "update seen jobs" && git push)
